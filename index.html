<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check In Online</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, "Sarabun", sans-serif;
    background: #e9f7ec; color: #222; line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 20px; max-width: 420px; width: 100%;
    box-shadow: 0 8px 30px rgba(67,160,71,0.18); overflow: hidden;
  }
  .head { background: #43a047; color: #fff; text-align: center; padding: 32px 20px 28px; }
  .logo {
    width: 76px; height: 76px; border-radius: 20px; background: #fff; color: #43a047;
    font-size: 40px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .head h1 { font-size: 24px; font-weight: 800; }
  .body { padding: 28px 22px 30px; }

  /* ปุ่มสี่เหลี่ยมจตุรัสใหญ่ */
  .dl {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none; cursor: pointer;
    width: 220px; max-width: 80%; aspect-ratio: 1 / 1; margin: 0 auto;
    background: #43a047; color: #fff; font-size: 22px; font-weight: 800;
    border-radius: 22px; box-shadow: 0 6px 0 #2e7d32; border: none;
    transition: transform .05s;
  }
  .dl:active { transform: translateY(5px); box-shadow: 0 1px 0 #2e7d32; }
  .dl .ic { font-size: 56px; line-height: 1; }
  .ver { text-align: center; color: #999; font-size: 12px; margin-top: 16px; }

  /* download progress bar */
  .progress { display: none; margin-top: 22px; }
  .bar { height: 14px; background: #e0e0e0; border-radius: 8px; overflow: hidden; }
  .barfill { height: 100%; width: 0%; background: #43a047; transition: width .15s; }
  .barlabel { text-align: center; font-size: 13px; color: #2e7d32; margin-top: 8px; font-weight: 600; }

  /* ปุ่ม Open File — ค้างถาวรหลังโหลดเสร็จ */
  .openbtn {
    display: none; width: 100%; margin-top: 18px; cursor: pointer;
    background: #2e7d32; color: #fff; font-size: 20px; font-weight: 800;
    padding: 18px; border: none; border-radius: 14px; box-shadow: 0 5px 0 #1b5e20;
  }
  .openbtn:active { transform: translateY(5px); box-shadow: 0 0 0 #1b5e20; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="logo">C</div>
      <h1>Check In Online</h1>
    </div>
    <div class="body">
      <a class="dl" id="dlBtn" href="CheckInOnline.apk" download onclick="return startDownload(event)">
        <span class="ic">📲</span>
        <span>Download<br>&amp; Install</span>
      </a>
      <div class="ver">Version 1.9 · for Android</div>

      <div class="progress" id="prog">
        <div class="bar"><div class="barfill" id="barfill"></div></div>
        <div class="barlabel" id="barlabel">0%</div>
      </div>

      <button class="openbtn" id="openBtn" onclick="openFile()">📂 Open File</button>
    </div>
  </div>

<script>
var apkBlobUrl = null;

function openFile() {
  if (!apkBlobUrl) { window.location.href = 'CheckInOnline.apk'; return; }
  // เปิดไฟล์ APK ที่โหลดไว้แล้ว → Android เด้งหน้าติดตั้งขึ้นมาใหม่ (ไม่โหลดจากเน็ตซ้ำ)
  var a = document.createElement('a');
  a.href = apkBlobUrl;
  a.download = 'CheckInOnline.apk';
  document.body.appendChild(a); a.click(); a.remove();
}

async function startDownload(e) {
  e.preventDefault();
  var prog = document.getElementById('prog');
  var fill = document.getElementById('barfill');
  var label = document.getElementById('barlabel');
  var ob = document.getElementById('openBtn');
  prog.style.display = 'block';
  ob.style.display = 'none';
  fill.style.width = '0%';
  label.textContent = 'Starting…';
  try {
    var resp = await fetch('CheckInOnline.apk');
    var total = parseInt(resp.headers.get('Content-Length') || '0', 10);
    var reader = resp.body.getReader();
    var received = 0, chunks = [];
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      chunks.push(r.value);
      received += r.value.length;
      if (total) {
        var pct = Math.round(received / total * 100);
        fill.style.width = pct + '%';
        label.textContent = pct + '%  (' + (received/1048576).toFixed(1) + ' / ' + (total/1048576).toFixed(1) + ' MB)';
      } else {
        label.textContent = (received/1048576).toFixed(1) + ' MB';
      }
    }
    var blob = new Blob(chunks, { type: 'application/vnd.android.package-archive' });
    apkBlobUrl = URL.createObjectURL(blob);
    fill.style.width = '100%';
    label.textContent = '100%  ·  ดาวน์โหลดเสร็จ';
    // เริ่มติดตั้งครั้งแรกให้เลย + โชว์ปุ่ม Open File ค้างไว้ (กดซ้ำได้ตลอด)
    openFile();
    ob.style.display = 'block';
  } catch (err) {
    label.textContent = 'กำลังดาวน์โหลด…';
    window.location.href = 'CheckInOnline.apk';
  }
  return false;
}
</script>
</body>
</html>
