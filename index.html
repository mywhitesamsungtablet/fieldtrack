<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตั้ง Check In Online</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, "Sarabun", sans-serif;
    background: #e9f7ec; color: #222; line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 20px; max-width: 420px; width: 100%;
    box-shadow: 0 8px 30px rgba(67,160,71,0.18); overflow: hidden;
  }
  .head { background: #43a047; color: #fff; text-align: center; padding: 32px 20px 24px; }
  .logo {
    width: 76px; height: 76px; border-radius: 20px; background: #fff; color: #43a047;
    font-size: 40px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .head h1 { font-size: 24px; font-weight: 800; }
  .head p { font-size: 14px; opacity: .92; margin-top: 4px; }
  .body { padding: 24px 22px 28px; }
  .dl {
    display: block; text-decoration: none; text-align: center;
    background: #43a047; color: #fff; font-size: 19px; font-weight: 700;
    padding: 16px; border-radius: 14px; box-shadow: 0 4px 0 #2e7d32;
    transition: transform .05s;
  }
  .dl:active { transform: translateY(4px); box-shadow: 0 0 0 #2e7d32; }
  .ver { text-align: center; color: #999; font-size: 12px; margin-top: 10px; }
  .note {
    background: #f1f8e9; border: 1px solid #c5e1a5; border-radius: 12px;
    padding: 12px 14px; font-size: 13px; color: #33691e; margin-top: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="logo">C</div>
      <h1>Check In Online</h1>
      <p>แอปลงเวลา/ติดตามงานพนักงานภาคสนาม</p>
    </div>
    <div class="body">
      <a class="dl" href="CheckInOnline.apk" download>📲 ดาวน์โหลด &amp; ติดตั้ง</a>
      <div class="ver">เวอร์ชัน 1.7 · สำหรับ Android</div>

      <div class="note">
        💡 เปิดแอปครั้งแรก ให้อนุญาตตำแหน่งเป็น <b>"ตลอดเวลา"</b> แล้วเปิดสวิตช์ติดตาม
        (ถ้าเครื่องขึ้นเตือนตอนติดตั้ง เป็นข้อความปกติของ Android สำหรับแอปนอก Play Store กด "ติดตั้งต่อ" ได้เลย)
      </div>
    </div>
  </div>
</body>
</html>
